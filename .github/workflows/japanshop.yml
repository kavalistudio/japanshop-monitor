name: JapanShop API monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japanshop-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run JapanShop monitor
        id: monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 monitor.py | tee monitor.log
          if grep -q '^STATE_UPDATED=' monitor.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save new baseline
        if: steps.monitor.outputs.changed == 'true'
        run: |
          git config user.name "JapanShop monitor"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update JapanShop baseline"
          git push
